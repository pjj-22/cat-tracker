# Cat Tracker Configuration
# All values shown are defaults; only override what you need.

camera:
  width: 640
  height: 480
  fps: 15.0

servo:
  enabled: true
  pan_channel: 0
  tilt_channel: 1
  pan_center: 60
  tilt_center: 90
  pan_min: 0
  pan_max: 180
  tilt_min: 60
  tilt_max: 120
  deadzone: 50
  max_step: 5
  patrol_step: 0.6
  camera_hfov: 66
  camera_vfov: 49

detection:
  model_path: "yolo11s.onnx"
  confidence_threshold: 0.15
  iou_threshold: 0.4

tracking:
  max_missed: 45
  min_hits: 3
  iou_threshold: 0.3
  look_ahead: 2
  inference_every: 3

identification:
  profile_path: "cat_profiles.json"
  bins_h: 30
  bins_s: 32
  bins_v: 32
  hsv_weights: [0.7, 0.2, 0.1]
  min_saturation: 20
  min_value: 20

logging:
  position_log_path: "occupancy_log.csv"
